[repository]
name = "hyprknit"
authors = ["Mirza"]

[hyprknit]
description = "Knitted window borders for Hyprland"
authors = ["Mirza"]
output = "build/hyprknit.so"
build = [
  "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF",
  "cmake --build build --target hyprknit",
]
